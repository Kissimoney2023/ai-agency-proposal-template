# Netlify deploy config — static site, no build step.
# Deploy: `netlify deploy --prod`  (publishes this directory as-is)

[build]
  publish = "public"
  command = ""

# Long-cache the fingerprint-stable assets
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Sensible defaults everywhere
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
